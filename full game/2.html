<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EscapeX – C Programming Reference</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #020617;
            --accent-blue: #2563eb;
            --glass-header: rgba(15, 23, 42, 0.95);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg-dark); 
            color: #fff; 
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Professional Header */
        header { 
            background: var(--glass-header); 
            padding: 12px 24px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            border-bottom: 2px solid #1e293b;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            z-index: 100;
        }

        .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .logo-icon { font-size: 24px; }
        .logo-text { font-size: 20px; font-weight: 700; color: #fff; }
        .logo-text span { color: var(--accent-blue); }

        .nav-actions { display: flex; gap: 12px; }

        .btn {
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: none;
            cursor: pointer;
        }

        .btn-secondary { background: #334155; color: #f8fafc; }
        .btn-secondary:hover { background: #475569; transform: translateY(-1px); }

        /* PDF Viewer */
        .pdf-frame-container {
            flex-grow: 1;
            width: 100%;
            background: #0f172a;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Loading Spinner */
        .loader {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            color: #64748b;
        }

        @media (max-width: 650px) {
            header { padding: 10px; }
            .logo-text { display: none; }
            .btn { padding: 8px 12px; font-size: 12px; }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="brand">
            <span class="logo-icon">🎮</span>
            <span class="logo-text">Escape<span>X</span> Docs</span>
        </a>
        
        <div class="nav-actions">
            <a href="index.html" class="btn btn-secondary">
                <span>⬅</span> Back to Game
            </a>
        </div>
    </header>

    <div class="pdf-frame-container">
        <div class="loader">Loading Documentation...</div>
        <iframe 
            src="https://tigerprasad.com/public_html2/wp-content/uploads/2026/03/C-program-language_cheat-sheet.pdf#toolbar=0&navpanes=0&scrollbar=1" 
            title="C Programming Cheatsheet">
        </iframe>
    </div>

</body>
</html>
