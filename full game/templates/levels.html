<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EscapeX – Levels</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  background:#FF0000;
  color:#e5e7eb;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

.container{max-width:1200px;margin:auto;padding:20px}

/* HEADER */
header{
  background:#111827;
  border-bottom:1px solid #1f2937;
}
.header-inner{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.brand{
  font-size:1.3rem;
  font-weight:700;
}
nav a{
  color:#e5e7eb;
  text-decoration:none;
  margin-left:10px;
  padding:6px 14px;
  border-radius:6px;
}
nav a:hover{background:#1f2937}
nav a.active{background:#3b82f6}

/* CLOCK */
#dateTime{
  position:fixed;
  top:14px;
  right:20px;
  font-size:.85rem;
  opacity:.85;
}

/* MAIN */
main{flex:1;padding:30px 0}
h1{margin-bottom:8px}
p{color:#9ca3af}

/* LEVEL GRID */
.level-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:18px;
  margin-top:20px;
}

.level-card{
  background:#020617;
  border:1px solid #1f2937;
  border-radius:12px;
  padding:16px;
}

.level-header{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
  font-weight:600;
}

.progress{
  height:6px;
  background:#1f2937;
  border-radius:999px;
  margin-bottom:14px;
}
.progress span{
  display:block;
  height:100%;
  width:100%;
  background:#22c55e;
  border-radius:999px;
}

.start-btn{
  display:inline-block;
  padding:8px 18px;
  background:#3b82f6;
  color:#fff;
  border-radius:6px;
  text-decoration:none;
  font-weight:600;
}
.start-btn:hover{background:#2563eb}

footer{
  background:#020617;
  border-top:1px solid #1f2937;
  text-align:center;
  padding:14px;
  font-size:.85rem;
  color:#9ca3af;
}
</style>
</head>

<body>

<div id="dateTime"></div>

<header>
  <div class="container header-inner">
    <div class="brand">🎮 EscapeX</div>
    <nav>
    
      <nav class="main-nav">
        <a href="/main-menu" class="nav-link">Main Menu</a>
        <a href="/option" class="nav-link">Options</a>
        <a href="/ai-leaderboard" class="nav-link">AI Leaderboard</a>
      <a href="/levels" class="active">Levels</a>
    </nav>
  </div>
</header>

<main>
<div class="container">
<h1>Choose a Language</h1>
<p>Click ▶ Start Game to begin</p>

<div class="level-grid">

<div class="level-card">
 <div class="level-header"><strong>C</strong><span>10/10</span></div>
 <div class="progress"><span></span></div>
 <div style="text-align:center">
  <a href="/c-quiz" class="start-btn">▶ Start Game</a>
 </div>
</div>

<div class="level-card">
 <div class="level-header"><strong>C++</strong><span>10/10</span></div>
 <div class="progress"><span></span></div>
 <div style="text-align:center">
  <a href="/cpp-quiz" class="start-btn">▶ Start Game</a>
 </div>
</div>

<div class="level-card">
 <div class="level-header"><strong>Java</strong><span>10/10</span></div>
 <div class="progress"><span></span></div>
 <div style="text-align:center">
  <a href="/java-quiz" class="start-btn">▶ Start Game</a>
 </div>
</div>

<div class="level-card">
 <div class="level-header"><strong>Python</strong><span>10/10</span></div>
 <div class="progress"><span></span></div>
 <div style="text-align:center">
  <a href="/python-quiz" class="start-btn">▶ Start Game</a>
 </div>
</div>


<div class="level-card">
  <div class="level-header"><strong>Php</strong><span>10/10</span></div>
  <div class="progress"><span></span></div>
  <div style="text-align:center">
   <a href="/php-quiz" class="start-btn">▶ Start Game</a>
  </div>
 </div>
</div>
</div>
</main>

<footer>
© 2025 EscapeX • Learn Programming Like a Game
</footer>

<script>
const dt=document.getElementById("dateTime");
function updateTime(){
 const n=new Date();
 dt.textContent=n.toLocaleString("en-IN",{
  weekday:"long",
  year:"numeric",
  month:"long",
  day:"numeric",
  hour:"numeric",
  minute:"2-digit",
  second:"2-digit",
  hour12:true
 });
}
updateTime();
setInterval(updateTime,1000);
</script>

<!-- 🔊 GLOBAL MUSIC -->
{% include 'music.html' %}

</body>
</html>
