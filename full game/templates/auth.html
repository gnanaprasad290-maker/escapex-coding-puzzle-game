<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EscapeX | Auth</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Poppins,sans-serif;}
body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#008000;
}
.box{
  background:#fff;
  padding:30px;
  border-radius:16px;
  width:360px;
}
h2{text-align:center;margin-bottom:16px;}
input{
  width:100%;
  padding:10px;
  margin-bottom:12px;
}
button{
  width:100%;
  padding:12px;
  border:none;
  background:#4f46e5;
  color:#fff;
  cursor:pointer;
}
.flash-message {
  background: #fee2e2;
  color: #b91c1c;
  margin-bottom: 12px;
  padding: 8px;
  border-radius: 8px;
  text-align: center;
}
.switch{text-align:center;margin-top:12px;}
.switch span{color:#4f46e5;cursor:pointer;}
.hidden{display:none;}
</style>
</head>

<body>

<div class="box">

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="flash-message">{{ messages[0] }}</div>
    {% endif %}
  {% endwith %}

  <!-- LOGIN -->
  <form id="loginForm" method="POST" action="/login" class="{% if mode == 'signup' %}hidden{% endif %}">
    <h2>Login</h2>
    <input name="username" placeholder="Username" required>
    <input name="password" type="password" placeholder="Password" required>
    <button type="submit">Login</button>
    <div class="switch">
      No account? <span onclick="showSignup()">Sign up</span>
    </div>
  </form>

  <!-- SIGNUP -->
  <form id="signupForm" class="{% if mode != 'signup' %}hidden{% endif %}" method="POST" action="/signup">
    <h2>Sign Up</h2>
    <input name="username" placeholder="Username" required>
    <input name="email" type="email" placeholder="Email" required>
    <input name="password" type="password" placeholder="Password" required>
    <button type="submit">Create Account</button>
    <div class="switch">
      Have account? <span onclick="showLogin()">Login</span>
    </div>
  </form>

</div>

<!-- 🔊📳 GLOBAL MUSIC + HAPTICS -->
{% include 'music.html' %}

<script>
function showSignup(){
  loginForm.classList.add("hidden");
  signupForm.classList.remove("hidden");
}
function showLogin(){
  signupForm.classList.add("hidden");
  loginForm.classList.remove("hidden");
}
</script>

</body>
</html>
